name: CI

on:
  push:
    branches: [main, ru]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test .env (dummy values, no secrets)
        run: |
          cp .env.example .env
          sed -i 's/^TELEGRAM_BOT_TOKEN=.*/TELEGRAM_BOT_TOKEN=test:token/' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=sqlite+aiosqlite:///./ci_test.db|' .env

      - name: Run tests
        run: pytest tests/ -q

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Import order check (isort)
        run: isort --check-only --profile black src/ tests/
